name: CI

on:
  pull_request:
    branches: [release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean -Pgroup=com.github.juspay -Pversion=0.0.0-ci -xtest -xlint assemble publishToMavenLocal

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README examples match the sample app
        run: bash scripts/verify-readme.sh

      - name: Lint README and docs
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            docs/**/*.md
